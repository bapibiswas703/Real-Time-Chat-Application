services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a local development password}
      POSTGRES_DB: chat
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chat -d chat']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7.4-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD to a local development password}
    command:
      [
        'sh',
        '-c',
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly no',
      ]
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
